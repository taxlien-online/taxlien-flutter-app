name: TaxLien.online CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

env:
  FLUTTER_VERSION: '3.24.0'
  JAVA_VERSION: '17'

jobs:
  # Job 1: Code Quality & Testing
  test:
    name: Test & Code Quality
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate localization files
      run: flutter gen-l10n
      
    - name: Analyze code
      run: flutter analyze
      
    - name: Run tests
      run: flutter test
      
    - name: Check formatting
      run: dart format --output=none --set-exit-if-changed .

  # Job 2: Build Android APK & AAB
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate localization files
      run: flutter gen-l10n
      
    - name: Setup Android keystore
      run: |
        echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/taxlien-release-key.keystore
        
    - name: Create keystore.properties
      run: |
        echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/keystore.properties
        echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/keystore.properties
        echo "keyAlias=taxlien-key-alias" >> android/keystore.properties
        echo "storeFile=../taxlien-release-key.keystore" >> android/keystore.properties
        
    - name: Build APK
      run: flutter build apk --release
      
    - name: Build App Bundle
      run: flutter build appbundle --release
      
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-apk
        path: build/app/outputs/flutter-apk/app-release.apk
        
    - name: Upload AAB artifact
      uses: actions/upload-artifact@v4
      with:
        name: android-aab
        path: build/app/outputs/bundle/release/app-release.aab

  # Job 3: Build iOS IPA
  build-ios:
    name: Build iOS
    runs-on: macos-latest
    needs: test
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Generate localization files
      run: flutter gen-l10n
      
    - name: Install CocoaPods dependencies
      run: |
        cd ios
        pod install --repo-update
        cd ..
        
    - name: Build iOS (no codesign)
      run: flutter build ios --release --no-codesign
      
    - name: Setup iOS certificates
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.IOS_BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      run: |
        # Create variables
        CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
        PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

        # Import certificate and provisioning profile from secrets
        echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode --output $CERTIFICATE_PATH
        echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode --output $PP_PATH

        # Create temporary keychain
        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        # Import certificate to keychain
        security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

        # Apply provisioning profile
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
        
    - name: Build and archive iOS
      run: |
        cd ios
        xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -destination generic/platform=iOS -archivePath Runner.xcarchive archive
        xcodebuild -exportArchive -archivePath Runner.xcarchive -exportPath . -exportOptionsPlist ExportOptions.plist
        cd ..
        
    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: ios-ipa
        path: ios/Runner.ipa

  # Job 4: Deploy to Google Play Store
  deploy-android:
    name: Deploy to Google Play
    runs-on: ubuntu-latest
    needs: build-android
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        
    - name: Download AAB artifact
      uses: actions/download-artifact@v4
      with:
        name: android-aab
        path: build/app/outputs/bundle/release/
        
    - name: Setup Google Play Service Account
      run: |
        echo "${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}" > google-play-service-account.json
        
    - name: Deploy to Google Play Store
      run: |
        pip3 install google-api-python-client google-auth-httplib2 google-auth-oauthlib
        python3 << 'EOF'
        import os
        import json
        from google.oauth2 import service_account
        from googleapiclient.discovery import build
        from googleapiclient.http import MediaFileUpload
        from googleapiclient.errors import HttpError

        PACKAGE_NAME = "taxlien.online"
        AAB_FILE = "build/app/outputs/bundle/release/app-release.aab"
        SERVICE_ACCOUNT_JSON = "google-play-service-account.json"
        TRACK = "internal"  # internal, alpha, beta, production

        print(f"🚀 Deploying {PACKAGE_NAME} to Google Play Store...")

        try:
            # Authentication
            credentials = service_account.Credentials.from_service_account_file(
                SERVICE_ACCOUNT_JSON,
                scopes=['https://www.googleapis.com/auth/androidpublisher']
            )
            
            service = build('androidpublisher', 'v3', credentials=credentials)
            
            # Create edit
            app_info = service.edits().insert(packageName=PACKAGE_NAME).execute()
            edit_id = app_info['id']
            
            # Upload AAB
            media = MediaFileUpload(AAB_FILE, mimetype='application/octet-stream', resumable=True)
            bundle_response = service.edits().bundles().upload(
                editId=edit_id,
                packageName=PACKAGE_NAME,
                media_body=media
            ).execute()
            
            version_code = bundle_response['versionCode']
            print(f"✅ AAB uploaded, version: {version_code}")
            
            # Create release
            release_body = {
                'releases': [{
                    'versionCodes': [version_code],
                    'status': 'draft',
                    'releaseNotes': [{
                        'language': 'ru-RU',
                        'text': 'Automated release from CI/CD pipeline'
                    }]
                }]
            }
            
            service.edits().tracks().update(
                editId=edit_id,
                packageName=PACKAGE_NAME,
                track=TRACK,
                body=release_body
            ).execute()
            
            # Commit changes
            service.edits().commit(editId=edit_id, packageName=PACKAGE_NAME).execute()
            
            print("🎉 Successfully deployed to Google Play Store!")
            
        except Exception as e:
            print(f"❌ Error: {e}")
            exit(1)
        EOF

  # Job 5: Deploy to App Store Connect
  deploy-ios:
    name: Deploy to App Store
    runs-on: macos-latest
    needs: build-ios
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download IPA artifact
      uses: actions/download-artifact@v4
      with:
        name: ios-ipa
        path: ios/
        
    - name: Deploy to App Store Connect
      env:
        APPLE_ID: ${{ secrets.APPLE_ID }}
        APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
        TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      run: |
        xcrun altool --upload-app \
          --type ios \
          --file "ios/Runner.ipa" \
          --username "$APPLE_ID" \
          --password "$APPLE_ID_PASSWORD" \
          --team-id "$TEAM_ID"

  # Job 6: Create Release
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [deploy-android, deploy-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/android-apk/app-release.apk
          artifacts/android-aab/app-release.aab
          artifacts/ios-ipa/Runner.ipa
        body: |
          ## TaxLien.online Mobile App Release
          
          ### What's New
          - Automated release from CI/CD pipeline
          - Bug fixes and improvements
          
          ### Downloads
          - **Android APK**: Direct installation
          - **Android AAB**: For Google Play Store
          - **iOS IPA**: For App Store Connect
          
          ### Installation
          - Android: Download APK and enable "Install from unknown sources"
          - iOS: Install via TestFlight or App Store
        draft: false
        prerelease: false
