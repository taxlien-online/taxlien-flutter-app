name: TaxLien.online
description: "TaxLien.online - is application for investing in Tax Liens and Tax Deeds"
license: NativeMindNONC
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 4.0.3

environment:
  sdk: '>=3.2.3 <4.0.0'

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # Core dependencies
  http: ^1.1.0
  shared_preferences: ^2.2.0
  sqflite: ^2.3.0  # Re-enabled for unified system
  path: ^1.8.3
  url_launcher: ^6.2.1
  webview_flutter: ^4.4.2
  
  # NFT and ICP libraries - implemented locally with best practices 2025
  
  # Additional utilities
  device_info_plus: ^12.1.0
  package_info_plus: ^4.2.0  # Compatible with flutter_magento_marketplace
  logger: ^2.6.1
  retrofit: ^4.7.2
  riverpod_annotation: ^3.0.0
  socket_io_client: ^3.1.2
  pull_to_refresh: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0
  visibility_detector: ^0.4.0+2
  win32_registry: ^2.1.0
  
  # UI/UX improvements
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  lottie: ^3.3.0  # Downgraded for flutter_magento compatibility
  
  # State management
  provider: ^6.1.1
  riverpod: ^3.0.0
  flutter_riverpod: ^3.0.0
  
  # Navigation
  go_router: ^16.2.0
  
  # Forms and validation
  form_builder_validators: ^11.2.0
  flutter_form_builder: ^10.1.0
  
  # Charts and data visualization
  fl_chart: ^1.0.0
  
  # Animations
  flutter_animate: ^4.2.0+1
  
  # Localization
  intl: ^0.20.2
  
  # Security
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.4  # Compatible with flutter_magento
  
  # Networking
  dio: ^5.3.2
  connectivity_plus: ^7.0.0
  
  # Magento Integration - Updated to latest version with blockchain support
  flutter_magento:
    path: ../flutter_magento  # Local development version 4.4.0
    # For production use: flutter_magento: ^4.4.0
  flutter_dotenv: ^5.1.0  # For environment configuration
  freezed_annotation: ^3.1.0  # Required by flutter_magento
  json_serializable: ^6.7.1  # For JSON serialization
  
  # NFT and Blockchain Integration
  # flutter_nft includes flutter_yuku as dependency
  flutter_nft: ^1.3.0
  # Access via IntegratedServices.instance.icp, .nftBlockchain, .yuku
  
  # Not available on pub.dev - kept commented out
  # flutter_magento_messenger: # Not found
  # flutter_magento_notifications: # Not found
  
  # State management
  flutter_hooks: ^0.21.3
  hooks_riverpod: ^3.0.0
  
  # Image handling
  image_picker: ^1.0.4
  image_cropper: ^11.0.0
  
  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.0.1
  
  # Notifications
  flutter_local_notifications: ^19.4.0
  
  # Biometrics
  local_auth: ^3.0.0
  
  # File handling
  file_picker: ^10.3.3  # Required by flutter_magento 4.3.1
  permission_handler: ^12.0.1
  path_provider: ^2.1.0
  
  # CSV export
  csv: ^6.0.0
  
  # Social sharing
  share_plus: ^12.0.0
  
  # Deep linking
  app_links: ^6.4.1
  
  # Analytics
  firebase_analytics: ^12.0.0
  firebase_crashlytics: ^5.0.0
  
  # Push notifications
  firebase_messaging: ^16.0.0
  
  # In-app purchases
  in_app_purchase: ^3.1.13
  
  # AdMob
  google_mobile_ads: ^6.0.0
  
  # Admin Panel - Using custom implementation to avoid dependency conflicts
  # flutter_adminpanel:
  #   path: ../flutter_adminpanel

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  build_runner: ^2.4.7
  json_annotation: ^4.8.1
  freezed: ^3.1.0  # Code generation for immutable classes
  json_serializable: ^6.7.1  # JSON code generation

dependency_overrides:
  pointycastle: ^3.9.1
  web: ^1.0.0
  socket_io_client: ^3.1.2  # Force version for flutter_magento compatibility
  # flutter_yuku is now included in flutter_nft
  # flutter_yuku:
  #   path: ../flutter_yuku

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/
    - .env
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
