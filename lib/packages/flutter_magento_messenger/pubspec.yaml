name: flutter_magento_messenger
description: Flutter library for Magento 2 user-to-user messaging functionality.
version: 1.0.0
homepage: https://github.com/nativemind/flutter_magento_messenger

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_magento:
    path: ../flutter_magento
  equatable: ^2.0.5
  intl: ^0.20.0 # For date formatting in messages
  dio: ^5.7.0 # For API communication

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  very_good_analysis: ^5.1.0

flutter:
  uses-material-design: true